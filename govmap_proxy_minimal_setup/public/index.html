<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GovMap Proxy</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17202a;
        --muted: #53606d;
        --line: #d7dde3;
        --panel: #f7f9fb;
        --accent: #0f766e;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: #ffffff;
      }

      main {
        width: min(1040px, calc(100% - 32px));
        margin: 32px auto;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
      }

      .origin {
        color: var(--muted);
        font-size: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 360px) minmax(0, 1fr);
        gap: 20px;
        margin-top: 24px;
      }

      section {
        min-width: 0;
      }

      label {
        display: grid;
        gap: 7px;
        margin-bottom: 14px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }

      input,
      select,
      textarea,
      button {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
      }

      input,
      select,
      textarea {
        padding: 10px 11px;
        color: var(--ink);
        background: #ffffff;
      }

      textarea {
        min-height: 130px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
      }

      button {
        height: 42px;
        border-color: var(--accent);
        color: #ffffff;
        background: var(--accent);
        font-weight: 750;
        cursor: pointer;
      }

      button:disabled {
        cursor: progress;
        opacity: 0.7;
      }

      pre {
        min-height: 420px;
        overflow: auto;
        margin: 0;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .status {
        display: grid;
        gap: 8px;
        margin-top: 16px;
        color: var(--muted);
        font-size: 13px;
      }

      .bad {
        color: var(--danger);
      }

      @media (max-width: 760px) {
        main {
          width: min(100% - 24px, 1040px);
          margin-top: 20px;
        }

        header,
        .grid {
          display: grid;
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>GovMap Proxy</h1>
          <div class="origin" id="origin"></div>
        </div>
      </header>

      <div class="grid">
        <section>
          <label>
            Operation
            <select id="operation">
              <option value="search">Search</option>
              <option value="spatial">Spatial</option>
              <option value="lookup">Lookup</option>
              <option value="proxy">Custom</option>
            </select>
          </label>

          <label>
            GovMap path
            <input id="path" placeholder="/path/from/govmap/rest/api" />
          </label>

          <label>
            Method
            <select id="method">
              <option value="GET">GET</option>
              <option value="POST">POST</option>
            </select>
          </label>

          <label>
            Query params
            <textarea id="params">{
  "q": "Jerusalem"
}</textarea>
          </label>

          <label>
            JSON body
            <textarea id="body"></textarea>
          </label>

          <button id="send">Send</button>

          <div class="status">
            <div id="config"></div>
            <div id="iframe"></div>
          </div>
        </section>

        <section>
          <pre id="output">{}</pre>
        </section>
      </div>
    </main>

    <script>
      const output = document.querySelector("#output");
      const send = document.querySelector("#send");
      const operation = document.querySelector("#operation");
      const path = document.querySelector("#path");
      const method = document.querySelector("#method");
      const params = document.querySelector("#params");
      const body = document.querySelector("#body");

      function pretty(value) {
        return JSON.stringify(value, null, 2);
      }

      function parseJsonField(node, fallback) {
        const text = node.value.trim();
        return text ? JSON.parse(text) : fallback;
      }

      async function loadConfig() {
        const response = await fetch("/api/govmap/config");
        const config = await response.json();
        document.querySelector("#origin").textContent = window.location.origin;
        document.querySelector("#config").textContent =
          `REST origin: ${config.origin || "not configured"}`;

        const iframeAllowed = config.allowedIframeOrigins.includes(window.location.origin);
        const iframeNode = document.querySelector("#iframe");
        iframeNode.textContent = iframeAllowed
          ? "Native iframe origin: allowed"
          : "Native iframe origin: use REST proxy here";
        iframeNode.className = iframeAllowed ? "" : "bad";
      }

      send.addEventListener("click", async () => {
        send.disabled = true;
        try {
          const payload = {
            method: method.value,
            params: parseJsonField(params, {}),
          };
          if (path.value.trim()) {
            payload.path = path.value.trim();
          }
          const jsonBody = parseJsonField(body, undefined);
          if (jsonBody !== undefined) {
            payload.json = jsonBody;
          }

          const response = await fetch(`/api/govmap/${operation.value}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const text = await response.text();
          try {
            output.textContent = pretty(JSON.parse(text));
          } catch {
            output.textContent = text;
          }
        } catch (error) {
          output.textContent = pretty({ error: error.message });
        } finally {
          send.disabled = false;
        }
      });

      loadConfig().catch((error) => {
        output.textContent = pretty({ error: error.message });
      });
    </script>
  </body>
</html>
