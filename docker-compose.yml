services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-municipality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-municipality}
      POSTGRES_DB: ${POSTGRES_DB:-municipality}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - municipality-postgis-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-municipality}:${POSTGRES_PASSWORD:-municipality}@db:5432/${POSTGRES_DB:-municipality}
      SOURCE_REGISTRY_SEED: ${SOURCE_REGISTRY_SEED:-config/gis/source_registry.seed.yaml}
      GIS_DASHBOARD_PROVIDER: ${GIS_DASHBOARD_PROVIDER:-govmap}
      GOVMAP_API_KEY: ${GOVMAP_API_KEY:-}
      GOVMAP_ORIGIN: ${GOVMAP_ORIGIN:-https://horizonscanninglab.org}
      GOVMAP_DASHBOARD_LIVE: ${GOVMAP_DASHBOARD_LIVE:-1}
      GOVMAP_ALLOWED_IFRAME_ORIGINS: ${GOVMAP_ALLOWED_IFRAME_ORIGINS:-https://horizonscanninglab.org,https://dev.horizonscanninglab.org}
      APP_PUBLIC_PATH_PREFIX: ${APP_PUBLIC_PATH_PREFIX:-}
      APP_REVERSE_PROXY_SECRET: ${APP_REVERSE_PROXY_SECRET:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  municipality-postgis-data:
