question_archetypes:
  - question_id: near_me_recent_decisions
    resident_question_he: "מה הוחלט לאחרונה על אזור המגורים שלי, ומה מתוך זה באמת קרוב אליי?"
    user_context_needed: [resident_address_or_neighborhood]
    protocol_evidence_needs: [municipal_action, decision, agenda_item, action_status]
    gis_need_tags: [resident_location, proximity, neighborhood, public_building, roadwork, public_space]
    layer_keys: [resident_location, neighborhoods_and_statistics, public_buildings_assets, roads_parking_public_works, playgrounds_youth_space]
    synergy_he: "הפרוטוקולים נותנים 'מה נאמר/הוחלט'; GIS מסנן למה שרלוונטי סביב הבית."
    answer_shape_he: "רשימת החלטות קרובות, מרחק/שכונה, שכבות שנפגעות, ורמת ודאות של הקישור."
    topic_affinity_examples_he: ["סדר יום ושאילתות", "תכנון ובנייה", "תשתיות וסביבה"]
  - question_id: parcel_allocation_watch
    resident_question_he: "האם יש הקצאות קרקע, הסכמי שימוש או פיתוח בגוש/חלקה ליד הבית שלי?"
    user_context_needed: [address_or_cadastral_id]
    protocol_evidence_needs: [agreement_or_allocation, decision, committee_protocol]
    gis_need_tags: [parcel, cadaster, land_allocation, ownership, planning, agreement]
    layer_keys: [parcels_cadaster, planning_land_use, public_buildings_assets, religious_services]
    synergy_he: "החלטות הקצאה הופכות למובנות רק כשהן מוצמדות לחלקה, ייעוד ובעלות."
    answer_shape_he: "חלקות/תכניות רלוונטיות, החלטות מקושרות, גוף מקבל, שימוש מתוכנן, וסייגי מקור."
    topic_affinity_examples_he: ["הקצאות ושימושים", "הסכמי רשות ופיתוח", "הקצאת מקרקעין למוסדות ציבור"]
  - question_id: school_future_near_child
    resident_question_he: "מה קורה עם בתי הספר והגנים באזור של הילדים שלי, והאם יש שינוי שיכול להשפיע על הליכה/רישום/קהילה?"
