version: 1
purpose_he: "Registry for conceptual Resident GIS RAG: match protocol evidence needs to compatible GIS context layers."

linking_modes:
  - id: resident_address_buffer
    label_he: "כתובת תושב + רדיוס"
    confidence: medium
    description_he: "כאשר התושב נותן כתובת או נקודה, מצרפים שכבות סביב מיקום התושב גם אם הפרוטוקול עצמו עירוני כללי."
  - id: explicit_cadaster_reference
    label_he: "גוש/חלקה/מגרש מפורשים"
    confidence: high
    description_he: "כאשר בפרוטוקול מופיע מזהה קדסטרלי, מקשרים לחלקה/גוש/תכנית ללא תלות בנושא."
  - id: named_facility_geocoding
    label_he: "שם מוסד או מתקן"
    confidence: medium
    description_he: "כאשר מופיע שם מקום, מוסד, מרכז מסחרי, בית ספר או פארק, מנסים התאמה בגזטיר/POI/כתובת."
  - id: neighborhood_or_statistical_area
    label_he: "רובע/שכונה/אזור סטטיסטי"
    confidence: medium
    description_he: "כאשר השאלה או המסמך מדברים על רובע, שכונה או אוכלוסייה, מוסיפים גבולות ושכבות דמוגרפיות."
  - id: citywide_context
    label_he: "הקשר עירוני כללי"
    confidence: low
    description_he: "כאשר אין מקום מדויק, מציגים מפת עיר/שכונות והקשר סטטיסטי בלבד, עם סימון אי-ודאות."

protocol_signal_types:
  - id: resident_address
    label_he: "כתובת או נקודת תושב"
  - id: named_place
    label_he: "שם מקום, מוסד, מתקן או רחוב"
  - id: cadastral_reference
    label_he: "גוש, חלקה, מגרש או תכנית"
  - id: service_population
    label_he: "קבוצת אוכלוסייה או שירות עירוני"
  - id: risk_or_hazard
    label_he: "סיכון, מפגע, בטיחות או חירום"
  - id: municipal_action
    label_he: "החלטה, בקשה, שאילתה, הצעה או הנחיה"
  - id: budget_or_support
    label_he: "תקצוב, תמיכה, מלגה או מימון"
  - id: agreement_or_allocation
    label_he: "הסכם, הקצאה, שימוש או פיתוח נכס"

layer_groups:
  - layer_key: resident_location
    display_name_he: "כתובות ונקודת תושב"
    govmap_category_he: "מיפוי, מתחמים וגבולות"
    govmap_aliases: [address, street, settlement]
    geometry: point
    tags: [resident_location, address_resolution, proximity, geocoding]
    protocol_signal_types: [resident_address, named_place]
    resident_synergy_he: "ממיר שאלה אישית כמו 'ליד הבית שלי' למוקד מרחבי שממנו אפשר להביא החלטות ושכבות."
    caveats_he: "דורש כתובת/נקודה מהתושב; אין להסיק כתובת מהפרוטוקול בלבד."
  - layer_key: neighborhoods_and_statistics
    display_name_he: "שכונות, רובעים ואזורים סטטיסטיים"
    govmap_category_he: "מיפוי, מתחמים וגבולות / נתונים סטטיסטיים"
    govmap_aliases: [neighborhoods_area, Neighborhood, stat_area_2022, STATISTIC_AREAS_2011, soec]
    geometry: polygon
    tags: [neighborhood, quarter, statistical_area, equity, demographic_context, citywide_context]
    protocol_signal_types: [resident_address, named_place, service_population, municipal_action]
    resident_synergy_he: "מראה אם החלטה עירונית פוגעת או מועילה במיוחד לשכונה של התושב, ולא רק לעיר כולה."
    caveats_he: "אזור סטטיסטי אינו תמיד זהה לשכונה שבה תושב משתמש בשפה יומיומית."
  - layer_key: municipal_boundaries
