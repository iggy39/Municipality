[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "municipality"
version = "0.1.0"
description = "Municipality discovery and versioned raw archive pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.28",
  "openai>=1.0",
  "psycopg[binary]>=3.2",
  "PyMuPDF>=1.24",
  "pyproj>=3.7",
  "pyshp>=2.3",
  "PyYAML>=6.0",
  "sqlalchemy>=2.0",
  "uvicorn>=0.34"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pre-commit>=4.0"
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
testpaths = [
  "tests"
]

[tool.setuptools.packages.find]
where = ["src"]
